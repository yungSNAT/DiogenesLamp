name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Sundays 21:17 UTC. The Cargo dependency audit also denies unmaintained crates on this run.
    - cron: "17 21 * * 0"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Branch protection and release.yml require these check names.
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every system the release builds for, on the image release.yml's
        # pinned release-binary.yml builds it on: the release fails unless the
        # tests pass on each, so a gap shows here before a tag. `os` only
        # names the check, as the image behind a -latest label moves.
        include:
          - { os: ubuntu-latest, image: ubuntu-24.04 }
          - { os: ubuntu-24.04-arm, image: ubuntu-24.04-arm }
          - { os: windows-latest, image: windows-2025 }
          - { os: windows-11-arm, image: windows-11-arm }
          - { os: macos-latest, image: macos-15 }
          - { os: macos-15-intel, image: macos-15-intel }
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust tests run the viewer's node suite and the browser parity
      # checks, and fail rather than skip without node, so it is installed
      # explicitly. The separate type check does not execute tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Only main saves, so pull requests cannot replace the shared entries.
      # 1 crate on 6 systems stays inside the 10 GB cache limit.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-toolchain.toml pins the compiler and its clippy and rustfmt components.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # fixture-transport is linted but not tested: it stops RateLimiter::wait
      # from sleeping, which tests/http.rs asserts.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
        if: matrix.os != 'ubuntu-latest' && matrix.os != 'windows-latest'
      # The local commit-msg guard is its own crate; its tests drive the hook
      # through git commit, so they run on every system.
      - run: cargo fmt --check --manifest-path tools/commit-msg/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path tools/commit-msg/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path tools/commit-msg/Cargo.toml
      # Coverage runs on Linux and Windows, as some code runs on only one of them;
      # Codecov merges the 2 reports. It needs llvm-tools and a prebuilt
      # cargo-llvm-cov, with no fallback to compiling it. Paths are made relative
      # (and forward-slashed on Windows) so the 2 reports name files alike.
      - run: rustup component add llvm-tools
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Test with line coverage
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        shell: bash
        run: |
          cargo llvm-cov --locked --remap-path-prefix --lcov --output-path coverage-rust.lcov
          if [ "$RUNNER_OS" = Windows ]; then
            sed -i '/^SF:/s|\\|/|g' coverage-rust.lcov
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'coverage-rust' || 'coverage-rust-windows' }}
          path: coverage-rust.lcov
          retention-days: 1
      - run: cargo build --locked --release

  # Linux releases are statically linked against musl (with mimalloc), so run
  # the test suite on musl in CI to catch libc differences before a tag.
  test-musl:
    name: test (ubuntu-musl)
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl C toolchain
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo test --locked --target x86_64-unknown-linux-musl

  # Catch RustSec advisories before the release gate, using the same pinned
  # prebuilt tool installer as the test job.
  audit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      # A vulnerability, unsound or yanked crate fails every run; an unmaintained crate
      # fails only the weekly scheduled run.
      - run: cargo audit ${{ github.event_name == 'schedule' && '--deny warnings' || '--deny unsound --deny yanked' }}

  # Holds the merged report Codecov reads at 100%. Codecov counts a line covered when
  # either the Linux or the Windows run covers it, so the floor takes each line's
  # highest count across both reports, prints each file:line still at 0 and fails on
  # any, or on reports with no lines.
  coverage-floor:
    name: coverage floor
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-rust*
          path: reports
      - name: Hold line coverage at 100%
        run: |
          awk -F'[:,]' '/^SF:/ { file = substr($0, 4) }
            /^DA:/ { key = file ":" $2; if (!(key in count) || $3 > count[key]) count[key] = $3 }
            END { for (key in count) { lines++; if (count[key] == 0) { print key; missed = 1 } }
                  exit missed || !lines }' \
            reports/coverage-rust/coverage-rust.lcov reports/coverage-rust-windows/coverage-rust.lcov

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. A Codecov outage fails only this job.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-rust*
          path: reports
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: reports/coverage-rust/coverage-rust.lcov,reports/coverage-rust-windows/coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true
