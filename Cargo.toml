[package]
name = "diogenes-lamp"
version = "0.1.3"
description = "Browse any Yupoo catalog locally as one fast, searchable page"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "lamp"
path = "src/lib.rs"

[[bin]]
name = "lamp"
path = "src/main.rs"

[[example]]
name = "browser_catalogue"
test = true

[features]
# Differential and integration harnesses only: answers HTTPS requests from a
# local fixture directory instead of the network. Never enabled in releases.
fixture-transport = []

[dependencies]
# No colour or derive macros; wrap_help sizes help to the terminal.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "wrap_help"] }
ctrlc = "3.5"
fancy-regex = "0.20.0"
flate2 = "1.1"
getrandom = "0.4.3"
idna = "1.1.0"
# The unicode-rs back end, not ICU4X (about 20 crates), for idna's UTS 46.
idna_adapter = "~1.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = "2.14.2"
# The system time zone, read from the zoneinfo files or, on Windows, a bundled copy.
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
regex = "1.13.1"
sha2 = "0.11.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "preserve_order", "serde"] }
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.5", features = ["process"] }
